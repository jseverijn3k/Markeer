<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src https: http: file: data:; base-uri 'none'; form-action 'none'">
<style>
:root { color-scheme:light dark; --ink:#292923; --muted:#78766e; --line:#e6e4dc; --paper:#fdfcf8; --accent:#356956; --wash:#f0eee7; }
* {box-sizing:border-box;} body {margin:0;background:var(--paper);color:var(--ink);font:17px/1.75 -apple-system,BlinkMacSystemFont,sans-serif;}
article {max-width:800px;margin:auto;padding:48px 52px 120px;min-height:100vh;outline:none;overflow-wrap:anywhere;}
article:empty:before {content:'Begin met schrijven…';color:var(--muted);}
section {display:flow-root;} p {margin:0 0 1em;} h1,h2,h3,h4,h5,h6 {line-height:1.25;letter-spacing:-.025em;margin:1.1em 0 .65em;font-weight:650;}
h1 {font-size:2.2em;} h2 {font-size:1.65em;} h3 {font-size:1.25em;} section:first-child h1 {margin-top:0;}
a {color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px;}
blockquote {border-left:3px solid var(--accent);margin:1em 0;padding:.2em 1.2em;color:var(--muted);}
pre {background:var(--wash);padding:18px 20px;border-radius:8px;overflow-x:auto;white-space:pre;line-height:1.6;} code {font: .86em/1.6 ui-monospace,Menlo,monospace;background:var(--wash);padding:2px 5px;border-radius:4px;} pre code {padding:0;background:none;}
ul,ol {padding-left:1.55em;margin:0 0 1em;} li {padding-left:.15em;} li p {margin-bottom:.35em;}
input[type=checkbox] {accent-color:var(--accent);margin-right:.55em;} table {border-collapse:collapse;width:100%;margin:1em 0 1.5em;font-size:.93em;} th,td {border:1px solid var(--line);padding:9px 13px;text-align:left;} th {background:var(--wash);font-weight:600;}
hr {border:0;border-top:1px solid var(--line);margin:2em 0;} img {max-width:100%;height:auto;border-radius:6px;}
::selection {background:#bfd7c8;} .raw-html {color:var(--muted);font-size:13px;border:1px dashed var(--line);}
@media(prefers-color-scheme:dark) {:root {--ink:#e7e5dc;--muted:#a5a499;--line:#3c4039;--paper:#222620;--accent:#9bc8af;--wash:#2c312a;} ::selection {background:#45634f;}}
@media(max-width:600px) {article {padding:32px 28px 100px;font-size:16px;}}
</style></head><body><article id="editor" contenteditable="true" role="textbox" aria-label="Opgemaakte Markdown-editor" aria-multiline="true" spellcheck="true"></article>
<script src="turndown.js"></script><script src="turndown-plugin-gfm.js"></script><script src="editor.js"></script>
</body></html>
